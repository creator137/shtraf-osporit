[project]
name = "shtraf-osporit-backend"
version = "0.1.0"
description = "Backend foundation for Shtraf.Osporit"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3,<4",
    "aiohttp>=3,<4",
    "aiohttp-socks>=0.9,<1",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.116,<1",
    "greenlet>=3,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
